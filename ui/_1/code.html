<!-- Login Panel -->
<div class="glass-panel rounded-xl shadow-2xl overflow-hidden flex flex-col relative">
<!-- Header Section -->

<div class="w-20 h-20 rounded-lg overflow-hidden border border-outline-variant shadow-md flex items-center justify-center bg-surface-container-high">
<img alt="SmartMine Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4C86BpXgFcnrR0ovkjVmpcjab-s2becA5KKNGlX15mgIA1vO9W4RDJW5T0K5mOfD5JmqpRZayWWWvmnBHzkncD-utIb1Oth6IuZZe37rmKJdvhc1OCMkcWQPQcDxZad9d4j9ubi0U7O7KowmE3lXcThIq-B3COR5Hh6bBTPkF19w0lCVytkXg_xwAKEQTyRwOU91LvB4lc8tp4dF8ilKfYu9jBAuEpluMZSWMsG8y19mY2vwxqyAe"/>

<p class="font-body-md text-body-md text-on-surface-variant mt-sm">سامانه هوشمند مدیریت ناوگان معدن</p>
</div>
</div>
<!-- Form Section -->
<form class="p-lg flex flex-col space-y-lg">
<!-- Driver ID -->
<div class="space-y-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant flex items-center space-x-reverse space-x-sm" for="driver-id">
<span class="material-symbols-outlined text-[18px]">badge</span>
<span>شناسه راننده</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-telemetry-lg text-telemetry-lg py-sm px-md outline-none transition-all" id="driver-id" readonly="" type="text" value="D-102"/>
<span class="absolute left-md top-1/2 -translate-y-1/2 material-symbols-outlined text-primary">verified</span>
</div>
</div>
<!-- Truck ID -->
<div class="space-y-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant flex items-center space-x-reverse space-x-sm" for="truck-id">
<span class="material-symbols-outlined text-[18px]">local_shipping</span>
<span>شناسه کامیون</span>
</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-telemetry-lg text-telemetry-lg py-sm px-md outline-none transition-all" id="truck-id" readonly="" type="text" value="T-27"/>
</div>
<!-- Shift -->
<div class="space-y-xs">
<label class="font-label-mono text-label-mono text-on-surface-variant flex items-center space-x-reverse space-x-sm" for="shift">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span>شیفت کاری</span>
</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-lg text-body-lg py-sm px-md outline-none transition-all" id="shift" readonly="" type="text" value="صبح"/>
</div>
<!-- Submit Button -->
<button class="btn-primary-gradient text-on-primary font-headline-sm text-headline-sm rounded-lg py-md w-full flex items-center justify-center space-x-reverse space-x-sm hover:brightness-110 active:scale-[0.98] transition-all mt-sm shadow-lg" type="button">
<span>ورود به سامانه</span>
<span class="material-symbols-outlined">login</span>
</button>

<div class="flex items-center space-x-reverse space-x-sm text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-secondary-fixed shadow-[0_0_8px_rgba(127,250,183,0.6)]"></span>
<span>وضعیت سامانه (فعال)</span>

<div class="flex items-center space-x-reverse space-x-sm text-on-surface-variant">

            08:42:15 UTC
